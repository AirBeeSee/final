networks:
  db_net:
  web_net:
volumes:
  db_data:
services:
  front:
    build: ./front
    ports:
        - "3000:3000"
    networks:
      - web_net
    depends_on:
      - back
  back:
    build: ./back
    networks:
      - web_net
      - db_net
    depends_on:
      - db
  db:
    image: couchdb:2.1
    networks:
      db_net:
        aliases:
          - couchdb
    volumes:
      - db_data:/opt/couchdb/data
